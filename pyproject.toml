[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baa-lel"
version = "0.1.0"
description = "Boundary-Uncertainty-Aware Lesion Evidence Learning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/JinlinYY/BUA-LEL"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["baa_lel*", "baselines*", "third_party*"]

[tool.setuptools.package-data]
"third_party.segment_anything" = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
