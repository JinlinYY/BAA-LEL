extends: base.yaml
dataset_name: IMAplusplus
num_classes: 2
image_dir: data/IMAplusplus/images
mask_dir: data/IMAplusplus/selected_masks
clinical_excel: data/IMAplusplus/metadata/clinical_binary.csv
save_dir: outputs/IMAplusplus/binary
fold_manifest_path: outputs/splits/IMAplusplus_binary_seed42.json
image_mode: rgb
fold_manifest_strategy: stratified_group
fold_group_column: group_id
clinical_exclude_columns:
- group_id
visual_backbone: imagenet_resnet50
backbone_unfreeze_policy: last_bottleneck
medsam_input_size: 256
freeze_medsam: false
unfreeze_medsam_last_n: 0
architecture_profile: extended
epochs: 30
batch_size: 8
early_stop_patience: 8
train_augmentation_profile: dermoscopy_mild
seg_bce_weight: 0.4
seg_dice_weight: 0.6
score_w_seg: 0.5
score_w_cls: 0.5
lambda_anchor: 0.0
use_uncertainty_weighting: false
